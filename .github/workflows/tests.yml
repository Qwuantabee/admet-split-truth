name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn rdkit matplotlib pytest
      - name: Claim audit (every README number bound to its phrase)
        run: python scripts/audit_claims.py
      - name: Tests
        run: |
          export PYTHONPATH=src
          pytest tests/ -q
